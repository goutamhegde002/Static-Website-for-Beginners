<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Shopping Cart</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
      }

      .product {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        width: 300px;
        margin: 20px;
        text-align: center;
        transition: transform 0.3s ease;
      }

      .product:hover {
        transform: scale(1.05);
      }

      .product img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
      }

      .product h3 {
        margin: 15px 0;
        color: #333;
      }

      .product p {
        color: #666;
        margin-bottom: 10px;
      }

      .price {
        font-size: 1.2em;
        color: #8f00ff;
      }

      .add-to-cart {
        background-color: #8f00ff;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .add-to-cart:hover {
        background-color: #6e00cc;
      }

      .cart {
        margin: 30px auto;
        width: 90%;
        max-width: 500px;
        background-color: #fff;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      .cart-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .cart-item:last-child {
        margin-bottom: 0;
      }

      .cart-item span {
        font-size: 1.1em;
      }

      .total {
        text-align: right;
        margin-top: 20px;
        font-size: 1.3em;
      }
    </style>
  </head>
  <body>
    <h1>Simple Shopping Cart</h1>

    <div class="container">
      <div class="product">
        <img src="https://via.placeholder.com/300x200" alt="Product 1" />
        <h3>Product 1</h3>
        <p class="price">$19.99</p>
        <button class="add-to-cart" onclick="addToCart('Product 1', 19.99)">
          Add to Cart
        </button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/300x200" alt="Product 2" />
        <h3>Product 2</h3>
        <p class="price">$24.99</p>
        <button class="add-to-cart" onclick="addToCart('Product 2', 24.99)">
          Add to Cart
        </button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/300x200" alt="Product 3" />
        <h3>Product 3</h3>
        <p class="price">$39.99</p>
        <button class="add-to-cart" onclick="addToCart('Product 3', 39.99)">
          Add to Cart
        </button>
      </div>
    </div>

    <div class="cart">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div class="total">Total: $<span id="total-price">0.00</span></div>
    </div>

    <script>
      let cart = [];

      function addToCart(productName, productPrice) {
        cart.push({ name: productName, price: productPrice });
        updateCart();
      }

      function updateCart() {
        let cartItemsContainer = document.getElementById("cart-items");
        cartItemsContainer.innerHTML = "";
        let total = 0;

        cart.forEach((item) => {
          let cartItem = document.createElement("div");
          cartItem.classList.add("cart-item");
          cartItem.innerHTML = `<span>${
            item.name
          }</span><span>$${item.price.toFixed(2)}</span>`;
          cartItemsContainer.appendChild(cartItem);
          total += item.price;
        });

        document.getElementById("total-price").innerText = total.toFixed(2);
      }
    </script>
  </body>
</html>
